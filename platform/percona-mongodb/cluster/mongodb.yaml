# MongoDB of the minimal stand (SRS 4.1.6, 6.4): replica set rs0 of 1 member, no backups.
# Service for clients: mongodb-rs0.data.svc:27017, URI mongodb://mongodb-rs0.data.svc:27017/?replicaSet=rs0.
# The system users Secret mongodb-secrets is generated by the operator. The password of chain-watcher is read from
# the Secret mongodb-users (key chain-watcher) made by the stand secrets script (later ESO), not from git.
apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: mongodb
  namespace: data
spec:
  crVersion: 1.23.1
  image: percona/percona-server-mongodb:8.0.32-14@sha256:5ba5f240d2dc98bc6236ab1d79c0862c4b62dba9d98cd0ffdf716c30473d2d11
  updateStrategy: SmartUpdate
  unsafeFlags:
    replsetSize: true
  sharding:
    enabled: false
  # The schema requires image next to enabled; neither component is deployed.
  backup:
    enabled: false
    image: percona/percona-backup-mongodb:2.15.0
  pmm:
    enabled: false
    image: percona/pmm-client:3.9.1
  users:
    - name: chain-watcher
      db: chain_watcher
      passwordSecretRef:
        name: mongodb-users
        key: chain-watcher
      roles:
        - name: readWrite
          db: chain_watcher
  replsets:
    - name: rs0
      size: 1
      affinity:
        antiAffinityTopologyKey: none
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      volumeSpec:
        persistentVolumeClaim:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
